name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race

      # Dogfood: pqcvet must scan its own source clean. Our analyzer and tests
      # reference broken-crypto packages via testdata fixtures only, not real
      # imports, so any real finding here is a regression worth surfacing.
      - name: pqcvet (self)
        run: go run ./cmd/pqcvet ./...
